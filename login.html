<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Blaze Applications</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-950 text-white font-sans antialiased flex items-center justify-center min-h-screen relative overflow-hidden">

    <!-- Efeito de luz de fundo rosa -->
    <div class="absolute w-[400px] h-[400px] bg-pink-600/15 rounded-full blur-[100px] pointer-events-none"></div>

    <div class="w-full max-w-md p-8 bg-neutral-900/60 border border-neutral-800 backdrop-blur-xl rounded-2xl shadow-2xl relative z-10 mx-4">
        
        <!-- Cabeçalho do Card (Logo e Título) -->
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center justify-center w-12 h-12 bg-pink-600 rounded-xl shadow-lg shadow-pink-600/30 mb-4 border border-pink-500/30">
                <span class="text-white font-bold text-xl">🔥</span>
            </a>
            <h1 class="text-2xl font-black tracking-tight">Bem-vindo de volta</h1>
            <p class="text-neutral-400 text-sm mt-1">Acesse sua conta para gerenciar seus bots</p>
        </div>

        <!-- Formulário de Login -->
        <form action="#" method="POST" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-neutral-300 uppercase tracking-wider mb-2">E-mail</label>
                <input type="email" required placeholder="seu@email.com" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-3 text-sm text-white placeholder-neutral-600 focus:outline-none focus:border-pink-600 transition-colors">
            </div>

            <div>
                <div class="flex items-center justify-between mb-2">
                    <label class="text-xs font-semibold text-neutral-300 uppercase tracking-wider">Senha</label>
                    <a href="#" class="text-xs text-pink-500 hover:underline">Esqueceu a senha?</a>
                </div>
                <input type="password" required placeholder="••••••••" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-3 text-sm text-white placeholder-neutral-600 focus:outline-none focus:border-pink-600 transition-colors">
            </div>

            <button type="submit" class="w-full bg-pink-600 hover:bg-pink-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-pink-600/30 transition-all text-sm mt-2">
                Entrar na Conta
            </button>
        </form>

        <!-- Rodapé do Card -->
        <div class="text-center mt-6 text-sm text-neutral-400">
            Ainda não tem uma conta? 
            <a href="#" class="text-pink-500 font-semibold hover:underline">Criar agora</a>
        </div>

    </div>

</body>
</html>
