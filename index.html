<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">

</head>
<body class="bg-neutral-950 text-white font-sans antialiased selection:bg-pink-600 selection:text-white">

    <!-- MENU INICIAL (NAVBAR) -->
    <header class="fixed top-0 left-0 w-full z-50 bg-neutral-950/80 backdrop-blur-md border-b border-pink-500/10">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-pink-600 rounded-xl flex items-center justify-center shadow-lg shadow-pink-600/30">
                    <span class="text-white font-bold text-xl">🔥</span>
                </div>
                <span class="text-xl font-extrabold tracking-wide text-white">BLAZE <span class="text-pink-600">APPLICATIONS</span></span>
            </div>
            <nav class="hidden md:flex items-center space-x-8 text-sm font-medium text-neutral-300">
                <a href="#inicio" class="hover:text-pink-500 transition-colors">Início</a>
                <a href="#recursos" class="hover:text-pink-500 transition-colors">Recursos</a>
            </nav>
            <div class="flex items-center space-x-4">
                <a href="login.html" class="text-sm font-medium text-neutral-300 hover:text-white transition-colors">Entrar</a>
                <a href="login.html" class="bg-pink-600 hover:bg-pink-500 text-white text-sm font-semibold px-5 py-2.5 rounded-xl shadow-lg shadow-pink-600/30 transition-all">
                    Criar Conta
                </a>
            </div>
        </div>
    </header>

    <!-- HERO SECTION -->
    <section id="inicio" class="pt-32 pb-20 md:pt-44 md:min-h-screen flex items-center justify-center relative overflow-hidden">
        <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-pink-600/20 rounded-full blur-[120px] pointer-events-none"></div>
        <div class="max-w-5xl mx-auto px-6 text-center relative z-10">
            <span class="inline-block bg-pink-600/10 text-pink-500 border border-pink-500/20 text-xs font-semibold px-4 py-1.5 rounded-full mb-6 uppercase tracking-wider">
                🚀 A Nova Era da Hospedagem de Bots
            </span>
            <h1 class="text-4xl md:text-6xl font-black tracking-tight leading-tight mb-6">
                Hospede seus bots com <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-rose-400">máxima velocidade</span> e estabilidade.
            </h1>
            <p class="text-neutral-400 text-lg md:text-xl max-w-2xl mx-auto mb-10">
                Painel moderno, uptime garantido de 24/7 e suporte total para Discord, WhatsApp e Telegram.
            </p>
            <a href="login.html" class="inline-block bg-pink-600 hover:bg-pink-500 text-white font-bold px-8 py-4 rounded-xl shadow-xl shadow-pink-600/30 transition-all">
                Começar Gratuitamente
            </a>
        </div>
    </section>

</html>
