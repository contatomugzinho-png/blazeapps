<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Blaze Applications</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-950 text-white font-sans antialiased min-h-screen flex flex-col">

    <!-- NAVBAR DO PAINEL -->
    <header class="bg-neutral-900 border-b border-neutral-800 h-16 flex items-center justify-between px-6">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 bg-pink-600 rounded-lg flex items-center justify-center font-bold text-sm">🔥</div>
            <span class="font-extrabold tracking-wide">BLAZE <span class="text-pink-600">PANEL</span></span>
        </div>
        <button onclick="logout()" class="text-sm text-neutral-400 hover:text-white transition-colors">Sair</button>
    </header>

    <!-- CONTEÚDO PRINCIPAL DO PAINEL -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-6 md:p-10">
        
        <!-- Cabeçalho e Botão Novo Bot -->
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-8">
            <div>
                <h1 class="text-2xl font-black">Visão Geral</h1>
                <p class="text-neutral-400 text-sm">Monitore e gerencie suas aplicações hospedadas na Blaze.</p>
            </div>
            <button onclick="alert('Funcionalidade de criar bot em breve!')" class="bg-pink-600 hover:bg-pink-500 text-white text-sm font-bold px-5 py-2.5 rounded-xl shadow-lg shadow-pink-600/30 transition-all">
                + Novo Bot
            </button>
        </div>

        <!-- CARDS DE ESTATÍSTICAS (Métricas dos Bots) -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
            <!-- Bots Hospedados -->
            <div class="bg-neutral-900/60 border border-neutral-800 p-5 rounded-2xl">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-semibold text-neutral-400 uppercase tracking-wider">Hospedados</span>
                    <span class="text-blue-500 text-sm font-bold">📦</span>
                </div>
                <div class="text-2xl font-black text-white" id="stat-total">0</div>
            </div>

            <!-- Bots Onlines -->
            <div class="bg-neutral-900/60 border border-neutral-800 p-5 rounded-2xl">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-semibold text-neutral-400 uppercase tracking-wider">Online</span>
                    <span class="text-emerald-500 text-sm font-bold">🟢</span>
                </div>
                <div class="text-2xl font-black text-emerald-400" id="stat-online">0</div>
            </div>

            <!-- Bots Offlines -->
            <div class="bg-neutral-900/60 border border-neutral-800 p-5 rounded-2xl">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-semibold text-neutral-400 uppercase tracking-wider">Offline</span>
                    <span class="text-amber-500 text-sm font-bold">🟡</span>
                </div>
                <div class="text-2xl font-black text-amber-400" id="stat-offline">0</div>
            </div>

            <!-- Erros Graves -->
            <div class="bg-neutral-900/60 border border-neutral-800 p-5 rounded-2xl">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-semibold text-neutral-400 uppercase tracking-wider">Erros Graves</span>
                    <span class="text-rose-500 text-sm font-bold">🔴</span>
                </div>
                <div class="text-2xl font-black text-rose-500" id="stat-erros">0</div>
            </div>
        </div>

        <!-- SEÇÃO DE LISTA DE BOTS / ESTADO VAZIO -->
        <div>
            <h2 class="text-lg font-bold mb-4">Seus Bots</h2>
            
            <!-- Estado Vazio (Aparece quando não tem bots) -->
            <div id="empty-state" class="bg-neutral-900/40 border border-neutral-800/80 rounded-2xl p-12 text-center">
                <div class="w-12 h-12 bg-pink-600/10 text-pink-500 rounded-xl flex items-center justify-center mx-auto mb-4 text-xl border border-pink-500/20">🤖</div>
                <h3 class="text-lg font-bold mb-2">Nenhum bot hospedado</h3>
                <p class="text-neutral-400 text-sm max-w-sm mx-auto mb-6">Você ainda não possui nenhuma aplicação rodando nos nossos servidores.</p>
                <button onclick="alert('Abra para criar bot!')" class="bg-neutral-800 hover:bg-neutral-700 text-neutral-200 text-sm font-semibold px-5 py-2.5 rounded-xl border border-neutral-700 transition-all">
                    Criar meu primeiro bot
                </button>
            </div>
        </div>

    </main>

    <script>
        // Verifica se está logado. Se não estiver, manda para o login.
        window.onload = function() {
            const loggedUser = localStorage.getItem('blaze_logged_in');
            if (loggedUser !== 'true') {
                window.location.href = 'login.html';
                return;
            }

            // Aqui futuramente você vai carregar os dados reais dos bots do usuário
            // Por enquanto está configurado em 0 para o estado vazio inicial
        }

        // Função de sair da conta
        function logout() {
            localStorage.removeItem('blaze_logged_in');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
